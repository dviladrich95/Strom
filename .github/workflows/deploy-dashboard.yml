name: Deploy Observable Case Study to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/observable/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: # allow manual trigger from GitHub UI

# Grant the action permission to write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/observable/package-lock.json

      - name: Install dependencies
        working-directory: docs/observable
        run: npm ci

      - name: Build Observable Framework site
        working-directory: docs/observable
        env:
          # Tells observablehq.config.js the subpath for GitHub Pages
          OBSERVABLE_BASE: /Strom/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Observable build output lands in docs/observable/dist
          path: docs/observable/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
